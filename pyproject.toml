[project]
name = "universal-music-transfer"
version = "0.1.0"
description = "Локальный сервис переноса лайков и плейлистов между музыкальными сервисами"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx[socks]>=0.27",
    "rapidfuzz>=3.9",
    "yandex-music>=3.2.2",
    "ytmusicapi>=1.10",
    "tidalapi>=0.8.4",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
# это приложение, а не библиотека: ставим только зависимости
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
